// KassirON for Android — a native app (Kotlin + Jetpack Compose) that works
// fully offline: the shop's data lives in a local SQLite database and is kept
// in sync with the server by the same protocol the desktop app uses
// (POST /api/device/activate, /api/sync/push, /api/sync/pull). See
// android/ARCHITECTURE.md.
//
// Release signing: keystore.properties (storeFile, storePassword, keyAlias,
// keyPassword) — kept out of git, see android/README.md.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'io.github.takahirom.roborazzi'
}

def keystoreProps = new Properties()
def keystorePropsFile = file(System.getenv('KASSIRON_KEYSTORE_PROPERTIES') ?: "${rootDir}/keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'uz.kassiron.app'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.kassiron.app'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '2.1.2'
        buildConfigField 'String', 'SERVER_URL', '"https://kassiron.uz"'
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            // KASSIRON_MINIFY_DEBUG=1: run the release's code shrinking against a local server (to catch R8 problems).
            if (System.getenv('KASSIRON_MINIFY_DEBUG') == '1') {
                minifyEnabled true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
            // The emulator reaches the PC's localhost as 10.0.2.2.
            buildConfigField 'String', 'SERVER_URL', '"' + (System.getenv('KASSIRON_DEBUG_SERVER') ?: 'https://kassiron.uz') + '"'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all { it.systemProperty 'robolectric.graphicsMode', 'NATIVE'; it.maxHeapSize = '2g' }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Background sync.
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    // HTTP.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Local sign-in: users' password hashes (PHP password_hash, bcrypt) come
    // down with the shop's data, so a cashier signs in offline.
    implementation 'org.mindrot:jbcrypt:0.4'

    // Barcode scanning with the camera.
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // JVM unit tests (pure business rules, e.g. SaleMath).
    testImplementation 'junit:junit:4.13.2'

    // Screenshot tests (JVM, no emulator): `./gradlew recordRoborazziDebug`
    // writes PNGs of every screen to app/build/outputs/roborazzi/ — see android/ARCHITECTURE.md.
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.32.2'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.32.2'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-junit-rule:1.32.2'
    testImplementation composeBom
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
