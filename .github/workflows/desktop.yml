name: Desktop (Windows)

# Builds the KassirON desktop installer for Windows: the Electron shell, PHP
# 8.3 for Windows and the KassirON code, checked by scripts/smoke-test.js
# with the bundled PHP before the installer is made.

on:
  workflow_dispatch:
  push:
    branches: [claude/friendly-fermi-qrkday]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      # Keep the files byte-identical to the server's (LF), or the bundled
      # code's version hash would differ from the server's and every fresh
      # install would immediately "update" to identical code.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
        working-directory: .

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Prepare build (code, PHP for Windows, CA bundle, license key)
        run: node scripts/prepare-build.js

      - name: Smoke test with the bundled PHP
        run: node scripts/smoke-test.js

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      # A new desktop/package.json version is published as a GitHub release:
      # the installer + latest.yml the app's auto-updater reads. The same
      # version again only builds, except that a release missing any of its
      # files (an interrupted upload) gets them. Code changes don't need a new
      # version: they reach the computers from kassiron.uz directly.
      #
      # Done with gh rather than electron-builder's --publish, which uploads
      # the files in parallel and let two uploads race to create the release.
      - name: Release a new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $files = @('dist/KassirON-Setup.exe', 'dist/KassirON-Setup.exe.blockmap', 'dist/latest.yml')
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "$file was not built" }
          }

          $assets = gh release view $tag --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "releasing $tag"
            gh release create $tag @files --repo "${{ github.repository }}" --target "${{ github.sha }}" `
              --title "KassirON $version" `
              --notes "KassirON kompyuter dasturi (Windows 10/11). O'rnatish: KassirON-Setup.exe ni yuklab olib ishga tushiring."
          } elseif (@($files | Where-Object { (Split-Path $_ -Leaf) -notin @($assets) }).Count -gt 0) {
            Write-Host "$tag is missing files: uploading them"
            gh release upload $tag @files --repo "${{ github.repository }}" --clobber
          } else {
            Write-Host "$tag is already released: build only"
            exit 0
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: KassirON-Setup
          path: |
            desktop/dist/KassirON-Setup.exe
            desktop/dist/latest.yml
          retention-days: 30
